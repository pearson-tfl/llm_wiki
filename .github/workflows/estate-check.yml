# Runs scripts/estate/check.sh on each push to estate, so a broken trunk
# shows within minutes of the seat's push. See ESTATE.md, Build.
name: Estate check

on:
  push:
    branches: [estate]

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: brew install protobuf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 22, the Node the installed app is built with (ESTATE.md, Build).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check
        run: scripts/estate/check.sh
